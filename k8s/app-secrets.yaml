# Secrets template. Replace the placeholder values before applying.
# For production, prefer `kubectl create secret generic app-secrets ...`
# or a sealed-secrets / external-secrets workflow instead of committing real values.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-gateway
type: Opaque
stringData:
  AUTH_SECRET: "replace-with-openssl-rand-base64-32"
  AUTHENTIK_ISSUER: "https://auth.example.com/application/o/ai-gateway/"
  AUTHENTIK_CLIENT_ID: "replace-me"
  AUTHENTIK_CLIENT_SECRET: "replace-me"
  LITELLM_MASTER_KEY: "sk-master-key"
