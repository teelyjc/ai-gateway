apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway-app
  namespace: ai-gateway
  labels:
    app: ai-gateway-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway-app
  template:
    metadata:
      labels:
        app: ai-gateway-app
    spec:
      containers:
        - name: app
          image: ai-gateways-wrapping:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-app
  namespace: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: ai-gateway-app
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
